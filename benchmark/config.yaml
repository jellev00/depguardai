runs_per_prompt: 3
judge_model: "gpt-4o-mini"
output_dir: "results"

agents:
  - name: "Mastra"
    type: mastra
    endpoint: "http://localhost:4111/api/agents/dependencyAgent/generate"
    model: "gpt-4o-mini"
    cost_per_1k_tokens: 0.005

  - name: "n8n"
    type: n8n
    endpoint: "http://localhost:5678/webhook/analyze-dependency"
    model: "gpt-4o-mini"
    cost_per_1k_tokens: 0.005

  - name: "OpenAI"
    type: openai
    api_key: ""
    model: "gpt-4o-mini"
    cost_per_1k_tokens: 0.005

test_prompts:
  - id: "react_minor"
    package_name: "react"
    from_version: "18.2.0"
    to_version: "18.3.0"
    update_type: minor
    notes: "Kleine minor update"
    changelog_source: "https://github.com/facebook/react/blob/main/CHANGELOG.md#1830-may-22-2023"
    expected_facts:
      - "18.3.0 is functioneel identiek aan 18.2.0 — er zijn geen nieuwe features toegevoegd"
      - "De release voegt uitsluitend deprecation warnings toe voor API's die in React 19 worden verwijderd"
      - "ReactDOM.render is deprecated — vervang door ReactDOM.createRoot"
      - "ReactDOM.hydrate is deprecated — vervang door ReactDOM.hydrateRoot"
      - "ReactDOM.unmountComponentAtNode is deprecated — vervang door root.unmount()"
      - "String refs in class components krijgen striktere warning — gebruik createRef()"
      - "defaultProps op function components is deprecated (nieuwe warning in 18.3.0)"
      - "Geen breaking changes in deze release zelf"
      - "Safe to update: Yes — drop-in vervanging, enkel nieuwe console-warnings"

  - id: "nextjs_minor"
    package_name: "next"
    from_version: "14.1.0"
    to_version: "14.2.0"
    update_type: minor
    notes: "Next.js minor — heeft eigen changelog site"
    changelog_source: "https://nextjs.org/blog/next-14-2"
    expected_facts:
      - "Turbopack stabiliteits- en performanceverbeteringen voor de dev server (stabieler voor grote applicaties)"
      - "Vernieuwd error overlay met licht/donker modus voor zowel App Router als Pages Router"
      - "Verbeterde hydration error messages met broncode van de mismatch (toont exacte locatie)"
      - "Nieuw experimenteel staleTimes config-optie voor Client-side Router Cache"
      - "Productie build memory gebruik drastisch verminderd: van ~2.2GB naar onder 190MB gemiddeld"
      - "Nieuw --experimental-debug-memory-usage flag voor next build"
      - "CSS chunking verbeterd om conflicterende stijlen bij navigatie te vermijden"
      - "Geen breaking changes"
      - "Safe to update: Yes — stabiele release met alleen verbeteringen"

  - id: "typescript_major"
    package_name: "typescript"
    from_version: "4.9.5"
    to_version: "5.0.4"
    update_type: major
    notes: "Major versie — mogelijk breaking changes"
    changelog_source: "https://devblogs.microsoft.com/typescript/announcing-typescript-5-0/"
    expected_facts:
      - "Nieuwe ECMAScript Stage 3 decorators (zonder experimentalDecorators flag) — andere API-structuur dan legacy decorators"
      - "Legacy decorator-libraries (NestJS, TypeORM, Angular) werken NIET met de nieuwe decorators zonder experimentalDecorators: true te blijven gebruiken"
      - "Nieuwe const modifier op type parameters voor const-achtige type-inferentie"
      - "Const enums die volledig constant zijn worden nu behandeld als union enums"
      - "Nieuwe moduleResolution: bundler optie voor betere compatibiliteit met moderne bundlers"
      - "Package grootte ~41% kleiner: van 63.8MB naar ~37.4MB"
      - "Minimale Node.js versie is nu 14.17 (officieel), met 12.20 als absolute minimum"
      - "ECMAScript target minimum is nu ES2018"
      - "Breaking: relational operators (> < >= <=) tussen string en number geven nu een type error"
      - "Deprecated tsconfig-opties (warning tot TS 5.5, daarna error): target ES3, out, noImplicitUseStrict, keyofStringsOnly, suppressExcessPropertyErrors, suppressImplicitAnyIndexErrors, noStrictGenericChecks, charset, importsNotUsedAsValues, preserveValueImports"
      - "Interne compiler API breaking changes: isTypeAssertion verwijderd, diverse factory function overloads verwijderd"
      - "Safe to update: With caution — controleer decorator-gebruik en deprecated tsconfig-opties"

  - id: "zod_patch"
    package_name: "zod"
    from_version: "3.22.3"
    to_version: "3.22.4"
    update_type: patch
    notes: "Kleine patch — verwacht bugfixes"
    changelog_source: "https://github.com/colinhacks/zod/releases/tag/v3.22.4"
    expected_facts:
      - "Patch release binnen de 3.22.x lijn — geen nieuwe features, geen breaking changes"
      - "De officiële changelog van Zod publiceert geen gedetailleerde notes voor individuele patch releases binnen een minor"
      - "Een agent die SPECIFIEKE bugfixes noemt voor 3.22.4 zonder bronvermelding fabriceert waarschijnlijk details"
      - "Safe to update: Yes — patch releases in Zod 3.22.x zijn veilig"
      - "Context: Zod 3.22.4 is de laatste stabiele 3.22.x versie"

  - id: "tailwind_minor"
    package_name: "tailwindcss"
    from_version: "3.3.0"
    to_version: "3.4.0"
    update_type: minor
    notes: "Tailwind heeft eigen docs site"
    changelog_source: "https://github.com/tailwindlabs/tailwindcss/releases/tag/v3.4.0"
    expected_facts:
      - "Dynamische viewport units: dvh, lvh, svh, dvw, lvw, svw classes (werken correct op mobiel, adresseren 100vh problemen)"
      - "Nieuwe :has() variant: has-[...] om parent elements te stylen op basis van hun children (CSS :has() polyfill)"
      - "Nieuwe * variant: style directe kinderen met *:class syntax"
      - "Nieuwe size-* utilities: breedte én hoogte tegelijk instellen (bv. size-4 = w-4 h-4)"
      - "Nieuwe text-wrap utilities: text-balance en text-pretty voor betere kopregelafbreking"
      - "Subgrid support: grid-cols-subgrid en grid-rows-subgrid"
      - "Uitgebreide opacity schaal met stappen van 5 (van 0 tot 100 in stappen van 5)"
      - "Nieuwe forced-colors variant voor forced colors mode (toegankelijkheid)"
      - "Grid rows uitgebreid van 6 naar 12"
      - "Nieuwe 3D transform utilities: rotate-x, rotate-y, etc."
      - "Geen breaking changes"
      - "Safe to update: Yes — volledig backwards compatible"
